services:
  postgis:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ypf_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=postgis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - postgis
      - redis

  celery:
    build: .
    command: celery -A ypf_backend worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_HOST=postgis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - postgis
      - redis

  celery-beat:
    build: .
    command: celery -A ypf_backend beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_HOST=postgis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - postgis
      - redis

volumes:
  postgres_data:
  redis_data:
